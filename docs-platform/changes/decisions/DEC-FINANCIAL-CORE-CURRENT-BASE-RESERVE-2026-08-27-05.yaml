title: Current Base reserve uses Current Base fixed and semi-fixed P&L inputs
status: approved
approved_by: project owner
approved_at: 2026-08-27T21:23:01.000Z
scope: >-
  Current Base Object must not use Historical Integrated Pilot fixed_opex_reserve_rub.
  It reserves six months of Current Base fixed and semi-fixed operating costs, uses
  protected Current Base labour, and excludes already-prepaid rent and separately
  financed or revenue-variable items. Historical Pilot reserve and Expansion policy remain unchanged.
