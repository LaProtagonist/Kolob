scope: >-
  Creative Cluster pays twelve months in advance and one month deposit; the
  prepaid credit begins after two rent-free months. Launch contingency remains
  distinct from operating reserve and initial inventory. Each investor capital
  tranche is locked for six months before it can receive principal repayment.
  Investor income begins only after all capital is repaid. All implementation
  remains a local feature-line change pending owner review.
