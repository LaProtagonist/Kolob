title: Operating Reserve is a dated six-month qualifying-cost liquidity balance
status: approved
approved_by: project owner
approved_at: 2026-08-28T12:00:01.000Z
scope: >-
  Current Base and Expansion reserve the same qualifying fixed/semi-fixed recurring
  cost classes. Marketing and household keep only their fixed components; Foodhall
  uses the contractual minimum and mandatory fixed services. Prepayment credit is
  consumed after rent-free months. Expansion funding is cohort/service-trigger dated,
  and Total Program Investment is distinct from Upfront Investor Funding.
