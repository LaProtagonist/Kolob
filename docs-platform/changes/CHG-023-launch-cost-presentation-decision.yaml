      accessed_at: 2026-08-05
      reliability: primary
      notes: Утверждает новые публичные тексты, демонстрационные значения покупки, аренды и площади, скрытие внутренних документов и динамический состав конфигурации. Не утверждает конкретное помещение, окончательный бюджет, ставки ремонта или мебели, финансовую модель либо условия сделки.
  - type: add
    entity: decisions
    value:
      id: DEC-013
      title: Уточнить публичную подачу расчёта стоимости запуска
      status: approved
      decision: Переименовать скрытую страницу в «Расчёт стоимости запуска», использовать итог «Стоимость запуска», добавить предварительную юридическую подпись, демонстрационный сценарий аренды 350 000 ₽ в месяц с предоплатой 12 месяцев и депозитом 2 месяца, ориентир покупки 69 000 000 ₽, площади 200/90/80 м², убрать технический язык и внутренние документы и показывать фактически включённые части текущей конфигурации.
      rationale: Прямое задание владельца проекта от 2026-08-05. Решение улучшает инвесторскую понятность страницы и сохраняет внутренний аудит, noindex, действующие формулы, ставки, CAPEX-архитектуру и одну единицу пароконвектомата.
