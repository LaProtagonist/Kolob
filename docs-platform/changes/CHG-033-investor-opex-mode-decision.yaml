      title: Добавить базовый расчёт и другую сумму операционных расходов
      status: approved
      decision: Сохранить базовую модель 2650000 RUB в месяц для объекта около 200 м² и добавить локальный режим другой ежемесячной суммы без автоматического масштабирования по площади; внутренние incomplete-module статусы не выводить в публичной итоговой панели.
      rationale: Прямое задание владельца проекта от 2026-08-11. Решение расширяет прозрачность существующей укрупнённой модели и не утверждает полноценную OPEX-модель или новые финансовые допущения.
