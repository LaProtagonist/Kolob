presentation:
  default_scenario: realistic
  opening_statement: Расчёт основан на текущих рабочих параметрах модели и используется для сценарной оценки экономики объекта.
  investment_note: Стартовый капитал включает не только создание объекта, но также первоначальный товарный запас, предоплату аренды и шестимесячный операционный запас.
  operating_reserve_note: Шестимесячный запас постоянных и ступенчато изменяемых операционных расходов.
  additional_launch_costs_note: Дополнительные расходы, возникающие после выбора конкретного помещения и подрядчиков, уточняются отдельно.
  tax_base_text: Базовый расчёт выполнен для УСН “Доходы минус расходы” 7% с рабочим предположением о применимости освобождения услуг общественного питания от НДС.
  tax_confirmation_text: Применимость налоговых льгот и специальных тарифов подтверждается перед запуском объекта.
  tax_conservative_text: Консервативный сценарий — УСН 7% + НДС 5%.
  ramp_up_text: "Объект выходит на рабочую загрузку постепенно: 60% в первый месяц, далее 70%, 80%, 85%, 90%, 95% и полная загрузка с седьмого месяца."
  seasonality_text: Продажи рассчитываются с сезонной кривой Санкт-Петербурга — от 0,75 в феврале до 1,18 в декабре. Сезонность применяется на всём горизонте расчёта.
  marketing_text: "Регулярный маркетинг: 150 000 ₽ в месяц плюс 2,4% продаж; в первые шесть месяцев не менее 400 000 ₽ в месяц. Маркетинг запуска 700 000 ₽ учтён отдельно в стартовом капитале."
  household_text: "Хозяйственные и эксплуатационные расходники: 50 000 ₽ в месяц плюс 50 000 ₽ × фактический поток чеков / 300."
  pessimistic_staffing_text: "Пессимистичный сценарий рассчитан для команды из 14 сотрудников: два повара основной линии в штате, один в смене при графике 2/2."
  ramp_and_seasonality_note: Модель учитывает постепенный выход объекта на рабочую загрузку и сезонность продаж.
  year_1_note: Первый год включает выход на загрузку, поэтому его показатели ниже зрелого режима работы.
  protected_base_note: Прямые затраты на продукцию и расходы на персонал рассчитаны от защищённой финансовой базы, а не от минимально возможной себестоимости.
  opening_month_note: Расчёт выполнен для открытия в январе; месяц открытия является рабочим параметром модели.
  discount_rate_text: NPV рассчитан при ставке дисконтирования 20%. Ставка является рабочим параметром и уточняется под требования конкретного инвестора.

