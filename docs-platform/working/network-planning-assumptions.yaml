document:
  id: DOC-NETWORK-PLANNING-ASSUMPTIONS
  version: "1.7"
  status: owner_approved_planning
  title: Network Planning Model — Investor Terminal v2.4
  provenance: owner-approved Investor Terminal temporal-network brief, 2026-08-26
  boundary: >-
    Planning assumptions for a future network. They do not replace the
    canonical integrated-pilot Financial Model or amend its historical facts.
references:
  financial_model: docs-platform/working/financial-model.yaml
  revenue_model: docs-platform/working/revenue-model.yaml
  physical_allocation: src/lib/physical-allocation.ts
base_object:
  # The original 350 000 ₽ Financial Model rent remains a historical pilot
  # reference. This is the current approved planning reference for the
  # Ligovsky 21 flagship used by the local Investor Terminal configuration.
  flagship_reference:
    preset_id: ligovsky-21-flagship
    monthly_rent_rub: 500000
    rent_free_months: 2
    provenance: owner_approved_flagship_planning_reference
    rent_free_provenance: owner_approved_temporal_planning_assumption
    historical_financial_model_rent_rub: 350000
temporal:
  financial_model_source: docs-platform/working/financial-model.yaml
  calendar_start_month_source: financial_model.model.opening_month
  horizon_months_source: financial_model.model.horizon_months
  ramp_up_profile_source: financial_model.model.ramp_up_profile
  seasonality_profile_source: financial_model.model.seasonality_profile
  # Owner-approved planning baseline from funding to commercial opening. It is
  # a planning assumption, not an engineering construction schedule.
  development_lead_months: 4
  rent_free_defaults:
    street: 2
    creative_cluster: 2
    foodhall: 0
  provenance: owner_approved_temporal_planning_assumption
point_schedule:
  core:
    label: "2/2 · 12 часов"
    roster_employees_per_concurrent_position: 2
  peak:
    label: "5/2 · 8 часов"
    roster_employees_per_concurrent_position: 1
staffing:
  payroll_contribution_scenario: reduced
  takeaway:
    portions_per_check_source: revenue_model.product_model.food_portions_per_check
    base:
      # The 150-check compact-point reference produces a little above 200
      # portions in the canonical product mix. Keep that rounding band at the
      # three-person base before the next operating step.
      up_to_portions_per_day: 249
      roles: { CASHIER_BAR: 1, LINE_COOK: 2 }
    growth:
      from_portions_per_day: 250
      through_portions_per_day: 299
      roles: { CASHIER_BAR: 1, LINE_COOK: 3 }
    high_traffic:
      from_portions_per_day: 300
      core_roles: { CASHIER_BAR: 1, LINE_COOK: 2, ADMINISTRATOR: 1 }
      peak_roles: { SOUS_CHEF: 1 }
  seating:
    minimum_total_area_m2: 60
    core_roles: { CASHIER_BAR: 1, LINE_COOK: 2, TECHNICAL: 1 }
    provisional_role_mapping: "Технический / универсальная функция зала и уборки"
  production:
    up_to_network_checks_per_day: 300
    prep_cooks_at_or_below_threshold: 1
    prep_cooks_above_threshold: 2
    capacity_review_after_two_prep_cooks: true
    schedule_default: "one_main_shift"
    capacity_evidence:
      demand_metric: food_portions_per_day
      demand_source: revenue_model.product_model.food_portions_per_check
      operating_model: >-
        Заготовочный цех производит тесто, начинки, подготовленные компоненты и
        полуфабрикаты. Финальная сборка и приготовление колобков происходят на
        торговых точках; продажная порция не является автоматически выпуском
        одной центральной машины.
      evidence_status: documented_machine_envelopes_without_process_capacity
      source_registry: docs-platform/registry/sources.yaml
      source_register: docs-platform/working/capex-equipment-register.yaml
      operations:
        - id: dough_mixing
          label: Замес теста
          asset_ids: [CAPEX-01-018]
          documented_batch_capacity: "ROSSO B10S: максимум 5 кг загрузки чаши 10 л"
          source_ids: [SRC-CAPACITY-20260827-ROSSO-B10S]
          operation_demand_status: requires_technical_cards
          limitation: "Нет граммовки теста на порцию, выхода теста и фактической длительности цикла."
        - id: filling_mechanical_preparation
          label: Механическая подготовка начинок
          asset_ids: [CAPEX-01-014, CAPEX-01-015]
          documented_batch_capacity: "Robot Coupe R 502: чаша 5,9 л; Hurakan HKN-22SC: паспортная производительность 250 кг/ч"
          source_ids: [SRC-CAPACITY-20260827-ROBOT-COUPE-R502, SRC-CAPACITY-20260827-HURAKAN-HKN-22SC]
          operation_demand_status: requires_technical_cards
          limitation: "Robot Coupe остаётся рабочим ориентиром комплекта; состав начинок, маршрутизация и допустимая загрузка не подтверждены."
        - id: thermal_preparation
          label: Тепловая подготовка
          asset_ids: [CAPEX-01-009, CAPEX-01-010]
          documented_batch_capacity: "Apach AP7QT: 7 уровней GN 1/1; TATRA TSV2: рекомендованная ванна до 50 л, но количество термостатов в BOM — TBD"
          source_ids: [SRC-CAPACITY-20260827-APACH-AP7QT, SRC-CAPACITY-20260827-TATRA-TSV2]
          operation_demand_status: requires_technical_cards
          limitation: "Не утверждены продуктовая загрузка GN/ванны, цикл, количество sous-vide и доля продукции, проходящая тепловую операцию."
        - id: vacuum_packaging
          label: Вакуумирование полуфабрикатов
          asset_ids: [CAPEX-01-013]
          documented_batch_capacity: "Hurakan HKN-VAC400E: камера 440×420×75 мм, насос 20 м³/ч, шов 390 мм"
          source_ids: [SRC-CAPACITY-20260827-HURAKAN-HKN-VAC400E]
          operation_demand_status: requires_technical_cards
          limitation: "Нет стандарта фасовки, загрузки камеры и длительности цикла."
        - id: cooling_and_storage
          label: Охлаждение и хранение
          asset_ids: [CAPEX-01-001, CAPEX-01-002, CAPEX-01-034]
          documented_batch_capacity: "Brema CB840 HC: 80 кг льда/24 ч и бункер 40 кг; source URL камер с индексом 8.81 конфликтует с historical base-description 15,9 м³"
          source_ids: [SRC-CAPACITY-20260827-BREMA-CB840-HC, SRC-CAPACITY-20260827-POLAIR-KHN-881]
          operation_demand_status: requires_technical_cards_and_source_reconciliation
          limitation: "Не выбран режим быстрого охлаждения (лёд или blast), нет нормы льда/охлаждения на кг, дней хранения, плотности укладки и согласованной модели камер."
      required_parameters:
        - id: production-tech-cards-and-routing
          question: "Для каждого продуктового семейства подтвердить граммовки теста, начинки и центрально подготовленных компонентов на порцию, выход партии и границу между цехом и торговой точкой."
          reason: "Преобразует 420/1421/2422/3423 food portions в demand конкретных операций и batch count."
        - id: process-cycles-and-cooling-standard
          question: "Подтвердить нормативную загрузку и длительность циклов combi/sous-vide/vacuum, а также технологию и норму быстрого охлаждения/хранения."
          reason: "Определяет machine-hours, охлаждение и storage utilization."
        - id: production-shift-and-utilization
          question: "Подтвердить usable hours одной смены, санитарные/переналадочные потери и допустимость второй смены для этого процесса."
          reason: "Определяет labour-hours, возможный эффект второй смены и её payroll; current salary semantics уже существуют."
      equipment_capacity_status: requires_technical_cards_and_process_parameters
      bottleneck: "Спрос в food portions/day рассчитан, но техкарты и утверждённые process cycles не позволяют превратить его в batch count, machine-hours, cooling/storage utilization или throughput линии."
      second_shift_status: not_modelled_requires_process_parameters
  shared_manager:
    role_id: MANAGER
    count_when_point_count_at_least: 1
