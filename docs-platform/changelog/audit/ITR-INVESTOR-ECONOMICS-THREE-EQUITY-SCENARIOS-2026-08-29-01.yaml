full_programme_residual_equity_fix:
  root_cause: >-
    The principal-first projector only calculated post-principal direct FCF share.
    A positive residual equity share was rendered as a right but generated no cash
    distribution, which could leave Cash IRR at 0% when direct FCF share was 0%.
  correction: >-
    After principal reaches zero, any same-month excess and later eligible
    distributable cash are allocated once through the shared residual-equity
    distribution path. Residual ownership itself is not a terminal cash flow.
  same_month_transition: >-
    Principal is capped at the outstanding amount; M32 then allocates the remaining
    eligible cash through the 40% equity distribution without double payment.
