human_readable_summary: Публичная страница переориентирована с внутренней подачи на предварительное инвесторское обсуждение: изменено название, убраны технические статусы и внутренние документы, добавлены демонстрационные параметры покупки и аренды и раскрыт состав рассчитываемого объекта.
field_edits:
  - field_id: page_title
    before: Расчёт стартового раунда инвестиций
    after: Расчёт стоимости запуска
    reason: Кратко и прямо описать назначение страницы без терминологии инвестиционного раунда.
    source_decision: DEC-013
    timestamp: 2026-08-05T00:30:13.084Z
  - field_id: total_title
    before: Ориентировочная потребность в финансировании
    after: Стоимость запуска
    reason: Обозначить крупную сумму как ориентировочную стоимость выбранной конфигурации.
    source_decision: DEC-013
    timestamp: 2026-08-05T00:30:13.084Z
  - field_id: legal_disclaimer
    before: Не является полной финансовой моделью
    after: Представленная информация носит предварительный характер и не является публичной офертой.
    reason: Использовать одну понятную предварительную юридическую подпись.
    source_decision: DEC-013
    timestamp: 2026-08-05T00:30:13.084Z
  - field_id: equipment_description
    before: Оборудование загружается из канонического CAPEX snapshot; мебель считается отдельно.
    after: Стоимость оборудования рассчитывается на основании актуального состава оснащения и текущих цен поставщиков. Мебель посадочного зала учитывается отдельно.
    reason: Убрать из публичного интерфейса внутреннюю техническую терминологию при сохранении источника расчёта.
    source_decision: DEC-013
    timestamp: 2026-08-05T00:30:13.084Z
  - field_id: next_steps_title
    before: Пока не включено или требует уточнения
    after: Следующие этапы расчёта
    reason: Представить дальнейшее уточнение как последовательный этап работы, а не ошибку модели.
    source_decision: DEC-013
    timestamp: 2026-08-05T00:30:13.084Z
  - field_id: calculation_basis_title
    before: Основания расчёта
    after: Что учитывает расчёт
    reason: Заменить перечень внутренних источников понятным описанием состава расчёта.
    source_decision: DEC-013
    timestamp: 2026-08-05T00:30:13.084Z
  - field_id: calculation_basis_note
    before: "Расчётные данные имеют статус «Исследование». Snapshot SHA-256 показывается пользователю."
    after: Расчёт основан на текущей модели проекта и актуальных ценовых ориентирах. Все параметры могут быть уточнены в ходе обсуждения конкретного сценария запуска.
    reason: Скрыть технический статус и hash, сохранив предупреждение о предварительном характере параметров.
    source_decision: DEC-013
    timestamp: 2026-08-05T00:30:13.084Z
