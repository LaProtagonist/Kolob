change_set_id: CHG-FINANCIAL-CORE-UNIFIED-RESERVE-2026-08-28-06
title: Unify Operating Reserve and dated rollout funding semantics
status: approved
approved_by: project owner
approved_at: 2026-08-28T12:00:01.000Z
scope:
  - Use one six-month qualifying fixed/semi-fixed Operating Reserve classification for Current Base and Network Expansion.
  - Exclude revenue-variable marketing, traffic household, direct sales costs, administrative reserve, tax, maintenance CAPEX and separately financed launch items from Operating Reserve.
  - Retain only fixed marketing (150,000 ₽) and fixed household (50,000 ₽) in Current Base reserve; Historical Integrated Pilot remains unchanged.
  - Apply rent-free months before prepaid-rent credit and include only contractually uncovered rent within each reserve horizon.
  - Replace the M3 all-expansion reserve with dated cohort and shared-service reserve funding events while retaining the approved rollout dates.
  - Distinguish Total Program Investment from Upfront Investor Funding in the local generated projection and Terminal summary.
  - Use a disclosed, research-backed 150,000 ₽/month planning baseline for early external refrigerated logistics; require future carrier-contract confirmation.
constraints:
  - no Google apply, Google redesign, OAuth action or remote document mutation
  - no production deployment, merge to master, branch change or Investor Sheet redesign
  - no change to revenue, tax, CAPEX, rent, rent holidays, staffing ladder, salaries, point presets, rollout dates, capacity policy or Historical Integrated Pilot calculations
  - no invented reserve drawdown, terminal recovery, new equity-return model or second-shift economics
  - Operating Reserve remains a funding/liquidity balance, never a monthly P&L expense
