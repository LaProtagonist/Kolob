  - The Petrogradka scenario YAML, equipment list, equipment status available_subject_to_confirmation, existing CAPEX assumptions, room parameters, route IDs, scenario IDs and internal enum IDs remain unchanged.
  - The new 2.5m RUB digital-platform ceiling, 6m RUB co-located launch floor and 11.5–12.5m RUB separate-reference-unit range are proposed working scenario estimates, not confirmed facts, budgets, quotes or financial-model inputs.
  - No Financial Model calculation, Financial Model sync, Network Planning sync, Google mutation or production deployment is introduced.
