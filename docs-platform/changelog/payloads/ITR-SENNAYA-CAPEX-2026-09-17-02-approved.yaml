                - CAPEX-01-021
                - CAPEX-02-063
              gaps:
                - Не оценён первоначальный комплект санитарных расходников
            - id: fiscal
              name: Кассы и фискализация
              item_ids:
                - CAPEX-04-001
                - CAPEX-04-004
                - CAPEX-04-011
                - CAPEX-04-012
              gaps:
                - Договор эквайринга, регистрация и интеграция учёта требуют уточнения; отдельный чековый принтер не нужен
            - id: kds
              name: Экраны заказов
              item_ids:
                - CAPEX-04-003
              gaps:
                - Кухонный принтер не добавляется при KDS; резервный процесс выдачи уточнить
            - id: network
              name: Сеть и резервное питание
              item_ids:
                - CAPEX-04-005
                - CAPEX-04-006
                - CAPEX-04-007
                - CAPEX-04-008
                - CAPEX-04-009
                - CAPEX-04-010
              gaps:
                - Покрытие, порты, PoE, кабели, автономность и резервный интернет ещё не закрыты; интернет — регулярный расход
            - id: hall
              name: Зал и гостевой поток
              item_ids:
                - CAPEX-05-028
                - CAPEX-05-029
                - CAPEX-05-030
              gaps:
                - Мебель по нормативу на место, не утверждённая ведомость столов и стульев; навигация и встроенные стойки — в подготовке
            - id: safety
              name: Безопасность
              item_ids: []
              gaps:
                - Видеонаблюдение и охрана — отдельный существующий норматив; пожарная безопасность и газ — технический проект
            - id: installation
              name: Доставка и запуск оборудования
              item_ids:
                - CAPEX-02-060
                - CAPEX-02-061
                - CAPEX-02-062
              gaps:
                - Требуются смета поставщиков, схема подключения и условия разгрузки
          external_groups:
            - furniture
            - security
            - point-preparation
          notes: Общий профиль; старые сохранённые конфигурации явно продолжают прежний состав. Полнота требует закрытия всех функций, не только наличия цены. Кофе и центральное производство исключены.
