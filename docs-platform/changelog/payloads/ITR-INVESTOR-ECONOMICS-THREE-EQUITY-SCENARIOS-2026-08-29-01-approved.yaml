title: Three governed equity discussion scenarios and live internal candidate comparison
status: approved
approved_by: project owner
approved_at: 2026-08-29T20:00:00.000Z
scope:
  - Replace the four public discussion presets with exactly three approved equity-based scenarios; retain capped cash flow only as an internal workbench model.
  - Publish the exact staged terms: 35% equity; 70% FCF to 1.30x then 15% equity; and 100% programme funding with 70% FCF to principal then 40% equity.
  - Correct the shared Investor Economics waterfall so a residual equity right produces actual post-transition owner distributions, not an omitted right or terminal valuation.
  - Keep Full Programme principal repayment cohort-maturity-based: each mature cohort can service capital while future rollout remains funded by the investor commitment.
  - Make /control/participation maintain distinct governed Published presets and local Candidate terms, with a live selected-scenario delta and a candidate three-scenario comparison.
constraints:
  - no deployment, production mutation, master merge, Google operation, branch change, push, pull, rebase or legal-instrument claim
  - do not alter Shared Financial Core formulas, sequential rollout, format-specific leads, ramp, reserve policy, CAPEX/OPEX, tax or capacity status
  - residual ownership value is excluded from Cash IRR and Cash MOIC; only actual cash distributions enter the metrics
