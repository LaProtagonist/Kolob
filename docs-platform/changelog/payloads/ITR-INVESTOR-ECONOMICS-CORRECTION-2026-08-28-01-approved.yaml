title: Correct local Investor Economics v1 and its business baseline
status: approved
approved_by: project owner
approved_at: 2026-08-28T16:00:00.000Z
scope:
  - Replace Creative Cluster one-month rent prepayment with the approved twelve-month prepayment while preserving its one-month deposit and two rent-free months.
  - Regenerate the governed Network/Financial Core before recalculating Investor Economics; no revenue, OPEX, tax, CAPEX, operating-reserve or rollout formula is independently changed.
  - Keep launch contingency, initial inventory and operating reserve as explicitly separate concepts and rename the investor-facing contingency line.
  - Add a six-month per-drawdown capital lock, an explicit capital-repayment mode and post-principal participation term to the existing typed Investor Economics projection.
  - Compact the local participation UI and reset terminal tab scroll before paint to prevent a blank Scaling workspace on Safari/iPad-like navigation.
  - Repair only the historical review-artifact validator evidence gap: temporarily restore hash-exact recoverable files for verification and mark the five irrecoverable historical launch-preparation screenshots superseded with exact provenance.
  - Permit a formally superseded unsealed applied iteration only when it has no content commit, so the replaced draft is not falsely verified.
constraints:
  - no Google apply, Google redesign, OAuth operation or remote document mutation
  - no production deploy, master merge, push or branch change
  - no new Business Financial Core or parallel Investor Economics engine
  - no invented logistics price, production capacity assumption, legal instrument, interest rate or final investor offer
  - temporary restored review artifacts are never staged or committed
