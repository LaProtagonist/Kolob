scope:
  - Apply the same owner-approved public/internal participation separation from the superseded unsealed manifest, now with every actually regenerated financial artifact in scope.
  - Public participation shows four governed discussion presets and no deal editor, sensitivity control or all-variants listing. The local Control Hub retains the candidate workbench, existing CAPEX component and truthful request-channel status.
  - Enforce a conservative governed four-month funding-to-first-sales development lead across Base and additional cohorts, then use the unchanged approved ramp to derive full-plan maturity and investor eligibility.
  - Keep production, master, Google, legal terms, capacity policy, tax, revenue, OPEX, CAPEX and reserve policy unchanged. /control and legacy CAPEX remain denied in production static output until server-side reverse-proxy authentication is separately implemented.
  - Regenerate local Financial Model, Financial Core and Investor Economics provenance artifacts; retain review PNGs only as ignored local output.
constraints:
  - no deployment, production mutation, merge, push, pull, branch switch or Google operation
  - no invented capacity throughput, legal instrument, exit valuation, interest rate or investor offer
  - no unauthenticated future production access to control routes
