title: Separate public participation presets, internal control workbench and four-month development lead
status: approved
approved_by: project owner
approved_at: 2026-08-29T00:00:00.000Z
scope:
  - Keep Investor Economics on its existing Shared Financial Core and Temporal Network Projection; do not create a parallel financial or investor engine.
  - Publish four governed discussion presets in the public participation view: equity, priority plus equity, capped cash flow and full-programme funding. Public visitors can select a preset but cannot edit deal terms or open sensitivity permutations.
  - Create local-only internal routes /control, /control/capex, /control/participation and /control/requests. Reuse the existing CAPEX data flow and retain editable candidate workbench terms only inside /control/participation.
  - Treat client-side route hiding and noindex as insufficient security. Production builds deny all /control routes and the legacy CAPEX alias until a reverse-proxy authentication integration contract is implemented.
  - Use the owner-approved conservative development lead of four months from funding to first sales for Base and every additional cohort. Preserve the governed ramp, seasonality, revenue, OPEX, tax, maintenance, CAPEX, reserve and capacity-review semantics.
  - Regenerate deterministic local Financial Core and Investor Economics artifacts, calculate before/after temporal results and keep investor distribution eligibility tied to cohort maturity rather than a global lock.
  - Add public/internal, temporal, routing and responsive browser invariants. Create ignored local review PNGs only; do not publish them.
constraints:
  - no production deployment, production mutation, master merge, push, pull, branch switch or Google operation
  - no new capacity throughput, legal instrument, valuation, interest rate, investor offer or financial-policy change
  - no public link, sitemap inclusion or unauthenticated production exposure for /control or /capex-configurator
  - contact requests remain a truthful integration-status view unless an existing protected persistent read path is available
