scope:
  - Map all 22 historical recurring OPEX lines to explicit Current Base, Point, Production or Shared Network treatment without changing accepted Current Base facts.
  - Package local Seating and Takeaway wash kits solely from already researched CAPEX register components; do not activate the integrated MOD-WASH bundle or invent a price.
  - Keep calculation availability distinct from pricing exclusions, assumptions requiring confirmation and production-capacity review.
  - Preserve known-basis Network P&L, tax, depreciation, maintenance CAPEX, FCF and reserve semantics while exposing any material missing input.
  - Treat owned-vehicle maintenance inside approved Logistics OPEX, exclude it from generic equipment maintenance CAPEX and disclose its unapproved useful-life policy.
  - Generate local Network Planning and Financial Core artifacts and make only minimal existing Terminal coverage/breakdown copy changes.
constraints:
  - no changes to Current Base rent, Ready Premises, revenue percentages, ramp, seasonality, rollout, location presets, staffing ladder, salary values, Foodhall or Creative Cluster contracts, bar default, logistics trigger, reserve horizon, tax algorithm, VAT baseline or existing CAPEX prices
  - no invented banking tariff, external-logistics contract, production throughput, second-shift premium, vehicle useful life, new production CAPEX or seating-area/furniture assumption
  - no Google apply, Google schema redesign, Google document mutation, OAuth action or Investor Sheet redesign
  - no production deployment, master merge or visual Terminal redesign
  - no rewrite of Historical Integrated Pilot or accepted Current Base regression outputs
