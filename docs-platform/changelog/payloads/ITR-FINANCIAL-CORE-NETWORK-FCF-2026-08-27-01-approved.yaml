title: Consolidate Network P&L and FCF through the shared financial core
status: approved
approved_by: project owner
approved_at: 2026-08-27T00:31:01.000Z
scope:
  - Build structured Current Base, Network Expansion and Consolidated Network projections from shared revenue, tax, depreciation, maintenance, FCF and temporal primitives.
  - Preserve Historical Integrated Pilot as a separate reference context and preserve accepted Current Base outputs.
  - Replace the former Expansion operating-contribution cash-flow label with a shared EBITDA minus tax minus maintenance CAPEX FCF basis.
  - Map each historical OPEX line explicitly to Current Base and an approved or unresolved Network scope; keep unpriced wash, banking, capacity and vehicle-policy gaps visible.
  - Reuse governed CAPEX and useful-life routing for Network asset depreciation and maintenance, including cohort-specific preparation routing.
  - Generate local Current Base, Expansion and 5/9/13-point Network artifacts plus local legacy Google payloads; do not apply them remotely.
constraints:
  - no new or changed rent, CAPEX, price, revenue, OPEX, payroll, tax-rate, reserve-horizon, rollout or capacity business facts
  - no invented price or rule for point wash packages, banking, vehicle maintenance/depreciation, unresolved historical OPEX or a second production shift
  - no Google apply, Google schema redesign, Google document mutation or OAuth operation
  - no production deployment, master merge or Terminal visual redesign
  - no change to the Historical Integrated Pilot reference facts or accepted Current Base regression controls
