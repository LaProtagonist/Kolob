title: Apply cohort-maturity Investor Economics waterfall and final local presentation review
status: approved
approved_by: project owner
approved_at: 2026-08-28T20:00:00.000Z
scope:
  - Replace the prior investor-drawdown age lock with a cohort-maturity eligibility gate driven by the approved M1–M7 revenue ramp and the dated Business Financial Core cohort projections.
  - Keep immature cohort FCF inside the business; permit mature FCF to enter the investor waterfall only after programme obligations and selected-deal liquidity rules.
  - Preserve Business Financial Core formulas, rollout dates, revenue, OPEX, tax, maintenance, CAPEX and reserve policies; no second financial engine is created.
  - State the Current Base temporal limitation exactly: the existing core opens Base in M0 and recognizes first sales in M1; no construction lag is invented without a separate owner decision.
  - Explain Creative Cluster prepayment's M19-to-M18 programme-payback crossing with a deterministic monthly test.
  - Simplify the local participation IA, use scenario-aware terminology, keep the monthly waterfall collapsed by default and localize its horizontal scroll on tablet/mobile.
  - Generate deterministic local full-page and executive PNG review artifacts; they are ignored review output, not governed content or production assets.
constraints:
  - no production deployment, master merge, push or branch change
  - no Google apply, Google redesign, OAuth operation or remote document mutation
  - no new capacity assumption, legal instrument, investor offer, exit valuation or interest rate
  - no alteration to the approved Creative Cluster prepayment, base/expansion reserve, tax or rollout business semantics
