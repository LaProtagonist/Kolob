title: Close Historic Centre furniture and document pre-publication capacity and reserve evidence
status: approved
approved_by: project owner
approved_at: 2026-08-27T16:45:01.000Z
scope:
  - Apply the owner-approved Historic Centre rollout baseline of 60 m² premises, 30 m² guest area and 19 seats through the existing 8,500 ₽ per-seat furniture calculation and existing contingency semantics.
  - Record source-backed machine envelopes for the central Production BOM and preserve the actual operating boundary: Production prepares dough, fillings, components and semifinished goods; final assembly and cooking stay at retail points.
  - Calculate production demand for Base, 5-, 9- and 13-point scenarios, but leave batch count, machine-hours, utilization and second-shift economics uncalculated where governed technical-card/process data is absent.
  - Make the Base fixed-OPEX reserve, Expansion recurring-OPEX reserve and consolidated financing reserve explicit, including their distinct bases and no-double-count composition.
  - Preserve the B3 vehicle policy: vehicle maintenance/repair remains in Logistics OPEX, vehicle is excluded from generic equipment maintenance CAPEX, and useful life remains confirmation-required without making current cash FCF unavailable.
  - Regenerate local Network Planning and Financial Core projections and make only a minimal existing Terminal reserve label clarification.
constraints:
  - no changes to Current Base rent, Ready Premises, revenue percentages, ramp, seasonality, rollout, location presets, staffing ladder, salary values, Foodhall or Creative Cluster contracts, bar default, logistics trigger, reserve horizon, tax algorithm, VAT baseline or established CAPEX prices
  - no invented production throughput, batch yield, cycle time, usable shift hours, second-shift premium/payroll, production expansion CAPEX, vehicle useful life, banking tariff or external-logistics contract
  - no silent correction of the cold-room source-label discrepancy; disclose it as a required source reconciliation
  - no Google apply, Google schema redesign, Google document mutation, OAuth action or Investor Sheet redesign
  - no production deployment, master merge or visual Terminal redesign
  - no rewrite of Historical Integrated Pilot or accepted Current Base regression outputs
  - temporary local links to already hash-verified historical review artifacts may exist only during release/seal validation; they must not be staged or committed and must be removed immediately after the seal
