scope:
  - Refine only /investor/franchise-platform/petrogradka as a concise, professional proposition for the owner of the equipped production premises.
  - Retain the core strategy route without content changes; limit CSS changes to scenario-page presentation and responsive layout.
  - Retain the complete grouped equipment inventory and internal confirmation metadata while removing all owner-visible technical status labels.
  - Remove repeated detailed prices from the project-additions cards and replace the public budget view with two proposed total launch orientations.
  - Supersede the prior proposed 6m RUB and 11.5–12.5m RUB public launch orientations without deleting their history; register 10m RUB and 15m RUB as new proposed working scenario estimates.
  - Update the matching proposed internal landlord proposition, deterministic route audit and scenario-governance test.
constraints:
  - Foundation v1.0 and Business Model Architecture v1.0 remain byte-for-byte unchanged.
  - Approved PRP blocks, the canonical financial baseline, Financial Model engine, Network Planning engine and the core Franchise Platform Strategy remain unchanged.
  - Petrogradka remains a research scenario and never becomes a baseline, premises decision, lease, financial result or approved CAPEX plan.
  - The Petrogradka scenario YAML, equipment list, equipment status available_subject_to_confirmation, existing detailed CAPEX assumptions, room parameters, route IDs, scenario IDs and internal enum IDs remain unchanged.
  - The 10m RUB co-located and 15m RUB separate-reference-unit orientations are proposed working scenario estimates, not confirmed facts, budgets, quotes, financial-model inputs or estimates broken down into invented costs.
  - The earlier 6m RUB and 11.5–12.5m RUB aggregate public orientations become superseded registry assumptions; their historical records remain intact.
  - No Financial Model calculation, Financial Model sync, Network Planning sync, Google mutation or production deployment is introduced.
