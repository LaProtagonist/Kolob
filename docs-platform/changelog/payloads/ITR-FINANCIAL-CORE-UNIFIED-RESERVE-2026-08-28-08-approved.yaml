scope:
  - Use one six-month qualifying fixed/semi-fixed Operating Reserve classification for Current Base and Expansion.
  - Include only fixed marketing and fixed household components; exclude sales-driven marketing and household components.
  - Apply rent-free months before prepaid-rent credit, and apply the credit before any cash rent payment.
  - Date reserve funding by cohort opening and shared-service trigger rather than funding the steady-state Expansion reserve in month 3.
  - Publish local typed artifacts that distinguish Base Start Investment, Rollout Funding Requirement, Total Program Investment and Upfront Investor Funding.
  - Record a research-backed, explicitly planning-only external refrigerated-logistics baseline for the 1–2 additional-point period.
constraints:
  - no Google apply, Google redesign, OAuth action or remote document mutation
  - no production deployment, master merge, branch change or Investor Sheet redesign
  - no change to revenue, tax, CAPEX, rent, rent holidays, staffing ladder, salaries, point presets, rollout dates, capacity policy or Historical Integrated Pilot calculations
  - no reserve drawdown, terminal recovery, equity-return model or second-shift economics
