title: Модель сети и франшизы — independent research v0.1
authorization: User implementation brief, sections 1–56, including content/code commit and governed seal. No deployment or Google publication.
scope:
  - Protected /control/franchise-model and navigation; separate build/state/engine/types
  - Editable research scenario Compact Production + Franchise v0.1, provenance, reset/duplicate/rename/delete/compare up to three
  - Bottom-up staffing, initial draw, normative settlement independent of actual franchise costs
  - Separate own/production/franchise/HeadCo economics; fixed costs once; dynamic rollout and manual capacity expansion
  - Staged funding on actual draws, reserve protection, bounded waterfall, investor CF IRR/MOIC; no commitment-as-investment
  - Required unit, auth, deterministic browser/responsive tests and one desktop screenshot
constraints:
  - Current Base, Financial Model v0.2, public Investor Terminal, Network Planning, Foundation/BMA and approved assumptions remain byte-identical
  - No invented confirmed costs/capacity; working references never become baseline
  - Missing franchise CAPEX and onboarding cost remain null; no missing-to-zero metric substitution
  - No central subsidy of actual local inefficiency; central settlement is management economics, not legal payment advice
  - Entry fee is gross cash, not automatically profit; taxes and maintenance require explicit inputs
  - No public route, header/footer/sitemap/prerender/bundle additions; no Google or deployment
