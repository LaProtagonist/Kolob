scope:
  route: /revenue-model
  summary: Удалить дублирующий самостоятельный блок объёма продаж и точечно сбалансировать композицию дневной производственной нагрузки без изменения модели, данных, формул или других страниц.
section_flow:
  removed:
    number: "03"
    title: Расчётный объём продаж
    reason: Месячный и дневной объём продаж уже постоянно показаны в правой итоговой панели.
  remaining:
    - { number: "01", title: Поток заказов }
    - { number: "02", title: Средний чек }
    - { number: "03", title: Производственная нагрузка }
    - { number: "04", title: Проверка мощности }
  derived_sales_values_removed: false
  sticky_summary_sales_values_preserved: true
daily_load:
  desktop_and_tablet:
    layout: three equal-height cards
    order: [checks, food, drinks]
    side_content_vertical_alignment: centered
  mobile:
    layout: vertical stack
    order: [checks, food, drinks]
    horizontal_overflow_allowed: false
  checks:
    value: 300
    label: Чеков в день
  food:
    total_line: 420 порций еды в день
    composition_label: Из них
    kolobok: 336 порций
    manches: 84
    invariant: 336 + 84 = 420
  drinks:
    value: 300
    label: Напитков в день
    included_in_food_total: false
hourly_load:
  average: { label: Средний час, food_portions: 35, checks: 25 }
  peak: { label: Пиковый час, food_portions: 46, checks: 33 }
  maximum: { label: Расчётный максимум, food_portions: 64, checks: 46 }
  product_split_visible_in_hourly_card: false
capacity_basis:
  maximum_line_load_label:
    before: Расчётный максимум по линиям
    after: Нагрузка в расчётный максимум
  maximum_line_load: ≈51 порция колобков · ≈13 манчесов
  kolobok_capacity_label: Расчётная рабочая мощность линии колобков
  kolobok_capacity_range: 60–90 порций в час
  serving_label: Сервировка
summary_warning: Расчёт показывает потенциальный объём продаж при выбранных параметрах.
boundaries:
  unchanged:
    - Revenue Model structured data, formulas, values and generated snapshot
    - average check, scenarios, production coefficients and derived calculations
    - launch-budget, capex-configurator and every other route
    - navigation, sitemap, SEO and design system
    - all approved copy outside the listed UI elements
  forbidden:
