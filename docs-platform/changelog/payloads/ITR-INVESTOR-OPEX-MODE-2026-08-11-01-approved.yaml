type: Investor Start Model operating-expense mode update
status: approved
approved_by: project owner
approved_at: 2026-08-11T14:38:26.000Z
scope:
  route: /launch-budget
  summary: Добавить выбор между базовым расчётом ежемесячных операционных расходов и другой пользовательской суммой, а также скрыть внутренние incomplete-module статусы из правой итоговой панели.
operating_expense_modes:
  selector_title: Расчёт операционных расходов
  default_mode: baseline
  options:
    - id: baseline
      title: Базовый расчёт
      description: Ориентир для объекта площадью около 200 м²
      baseline_area_m2: 200
      monthly_opex_rub: 2650000
    - id: custom
      title: Другая сумма
      description: Укажите ежемесячные операционные расходы
      field_label: Ежемесячные операционные расходы
      field_hint: Укажите общую сумму регулярных расходов объекта за один месяц.
      default_value: null
      value_rule: целое неотрицательное значение RUB
baseline_model:
  category_count: 7
  monthly_total_rub: 2650000
  categories_and_descriptions: unchanged
  accordion_visible: true
custom_model:
  accordion_visible: false
  formula: custom_monthly_opex_rub * reserve_months
  empty_value:
    monthly_opex_rub: null
    operating_reserve_rub: null
    public_value: Не рассчитано
    total_mode: partial lower bound
reserve_periods:
  options_months: [3, 6, 9]
  default_months: 6
  baseline_totals_rub:
    3: 7950000
    6: 15900000
    9: 23850000
  custom_example_monthly_rub: 2000000
  custom_example_totals_rub:
    3: 6000000
    6: 12000000
    9: 18000000
local_storage:
  preserve_existing_compatible_fields: true
  fields:
    operatingExpenseMode: baseline | custom
    customMonthlyOpexRub: nullable nonnegative integer
    operatingReserveMonths: 3 | 6 | 9
  baseline_value_is_not_stored_as_source: true
  reset:
    operatingExpenseMode: baseline
    customMonthlyOpexRub: null
    operatingReserveMonths: 6
right_panel:
  completeness_kept:
    - Оценено оборудование
    - Требуют КП
    - Подготовка помещения
    - Операционный запас
  hide_zero_unpriced_metric: true
  removed_public_outputs:
    - Обязательные части объекта
    - не сформированы полностью
    - Складское оснащение · Инженерная инфраструктура
  internal_modules_preserved:
    - MOD-STORAGE
    - MOD-ENGINEERING
invariants:
  no_area_scaling_formula: true
  contingency_formula_unchanged: true
  contingency_independent_of_operating_expense_mode: true
  capex_unchanged: true
  equipment_unchanged: true
  all_other_launch_budget_sections_unchanged: true
  google_files_unchanged: true
