commit_contract:
  content_subject: "fix(docs-platform): decouple web snapshots from governance seal"
  mandatory_trailers: [Iteration-ID, Decision-ID, Change-Set-ID, Approved-Payload-SHA256, Before-State-SHA256, After-State-SHA256, Timeline-Head-SHA256]
  separate_seal_commit: true
  push_branch_and_annotated_tag: true
deployment_contract:
  build_from_sealed_head: true
  receipt_after_smoke_test: true
  governance_only_receipt_commit: true
  repeated_deploy_not_required_when_content_state_sha256_is_unchanged: true
rollback_contract:
  mode: governed_reverse_change_set
  historical_mode: compensating_change
  git_reset_forbidden: true

