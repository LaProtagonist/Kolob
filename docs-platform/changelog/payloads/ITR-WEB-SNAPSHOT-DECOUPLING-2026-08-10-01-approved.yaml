schema_version: 2
payload_id: PAYLOAD-WEB-SNAPSHOT-DECOUPLING-2026-08-10-01
iteration_id: ITR-WEB-SNAPSHOT-DECOUPLING-2026-08-10-01
proposal_id: PROP-WEB-SNAPSHOT-DECOUPLING-2026-08-10-01
decision_id: DEC-WEB-SNAPSHOT-DECOUPLING-2026-08-10-01
change_set_id: CHG-WEB-SNAPSHOT-DECOUPLING-2026-08-10-01
title: Decouple CAPEX web content snapshots from governance seal and deployment history
status: approved
approved_by: project owner
approved_at: 2026-08-10T19:12:13.000Z
scope:
  - Separate page-affecting content state from append-only governance and deployment state.
  - Compute content_state_sha256 from normalized, ordered, relative content inputs without Git HEAD, seal data, timeline heads, receipts, generated timestamps or absolute paths.
  - Keep the CAPEX content snapshot reproducible and stale only when page-affecting content, its schema or generator logic changes.
  - Store live governance linkage in a separate non-build-critical projection.
  - Distinguish content drift from governance-only drift in deployment receipts and checks.
  - Extend deployment manifests with content, content-commit, seal-commit, build-head and dist hashes.
  - Prove clean npm ci and npm run build from a temporary worktree at sealed HEAD.
  - Preserve the current CAPEX values, launch-budget values, equipment names, page texts and page design byte-for-byte at the business-data level.
forbidden_scope:
  - equipment, prices, CAPEX scenarios or quantities
  - Investor Start Model, Foundation or Business Model Architecture content
  - Google Docs or Google Sheets writes
  - launch-budget formulas, assumptions, texts or design
  - capex-configurator calculations, texts or design
