  - Support comparison of equity, priority-plus-equity, capped cash-flow and full-programme principal-first scenarios.
  - Make full-programme commitment distinct from staged cash drawdowns and current external funding distinct from total programme investment.
  - Add a third local Investor Terminal section, a deterministic generated artifact and focused browser/unit coverage.
