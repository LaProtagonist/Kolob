supersedes_unsealed_iteration: ITR-INVESTOR-ECONOMICS-SEQUENTIAL-ROLLOUT-2026-08-29-01
scope:
  - Use one generic serial opening rule: next cohort funding is the month after the previous cohort opens; next opening is its funding month plus the specific format lead.
  - Govern Base/Creative Cluster/Foodhall/Street Takeaway/Street Seating development leads as 4/2/2/3/4 months without changing the approved seven-month ramp or seasonality.
  - Keep the two temporal gates separate: physical rollout releases on previous opening; investor distributions use each cohort's full-plan maturity only.
  - Regenerate 5/9/13 Business projections and the four public Investor Economics discussion presets from their shared source projection.
  - Use staged funding for public equity as well as the other public structures; actual investor cash dates are dated funding gaps, not an artificial M0 lump sum.
  - Preserve /control, its candidate workbench and protected-route architecture; public page remains exactly four read-only discussion scenarios with no deal controls or variants.
  - Assert in Financial Core that cohort and triggered shared reserves follow the derived M5/M8/M11/M16 dates, not the superseded fixed cadence.
constraints:
  - no deployment, production mutation, merge, push, pull, rebase, branch change or Google operation
  - no reserve, OPEX, CAPEX, tax, capacity, legal-instrument, valuation or deal-term policy change
  - do not expose /control or the legacy CAPEX route in production without the separately required server-side guard
