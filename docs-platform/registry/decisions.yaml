    title: Создать research-калькулятор стартовой потребности в инвестициях
    status: approved
    decision: Зафиксировать Investor Start Model v0.1 и опубликовать скрытую рабочую страницу /launch-budget. Калькулятор сравнивает покупку и аренду, использует каноническую CAPEX-архитектуру, отдельно оценивает мебель по research-ставке, показывает неполные данные как нижнюю границу и не выдаёт неизвестные статьи за ноль.
    rationale: Прямое задание владельца проекта от 2026-08-04. Модель предназначена для предварительного обсуждения порядка финансирования первого совмещённого объекта и не является финансовой моделью или окончательным инвестиционным предложением.
