  - id: DEC-005
    title: Зарегистрировать рабочую CAPEX-спецификацию v0.1 со статусом research
    status: approved
    decision: Создать и зарегистрировать CAPEX — Equipment Specification v0.1 как рабочий документ со статусом research, не утверждая перечисленное оборудование, цены, модели, финансовые показатели или итоговый CAPEX.
    rationale: Прямое задание владельца проекта от 2026-08-01 сохранить полную рабочую спецификацию без самостоятельного завершения отсутствующих разделов.
    affected_documents:
      - DOC-CAPEX-EQUIPMENT-SPECIFICATION
    approved_by: project owner
    approved_at: 2026-08-01
    supersedes: null
    source_ids:
      - SRC-CAPEX-EQUIPMENT-SPEC-V0-1-BRIEF
    updated_at: 2026-08-01
  - id: DEC-006
    title: Опубликовать три существующих документа проекта в Google Drive
    status: approved
    decision: Создать или обновить в проверенной папке «Колобочная — Investment» нативные Google Docs для Foundation v1.0, Business Model Architecture v1.0 и CAPEX — Equipment Specification v0.1, используя только соответствующие локальные источники и сохраняя их действующие статусы.
    rationale: Прямое задание владельца проекта от 2026-08-01; решение утверждает только техническую публикацию и не переутверждает, не редактирует и не расширяет содержание документов.
    affected_documents:
      - DOC-FOUNDATION
      - DOC-BUSINESS-MODEL-ARCHITECTURE
      - DOC-CAPEX-EQUIPMENT-SPECIFICATION
    approved_by: project owner
    approved_at: 2026-08-01
    supersedes: null
    source_ids:
      - SRC-GOOGLE-DRIVE-PUBLICATION-BRIEF
    updated_at: 2026-08-01
  - id: DEC-007
    title: Создать структурированный CAPEX Equipment Register v0.1 и обязательный lifecycle journal
    status: approved
    decision: Структурно преобразовать все 124 существующие записи CAPEX — Equipment Specification v0.1 в CAPEX Equipment Register v0.1 со статусом research, не меняя смысл исходных позиций; создать производные CSV и нативную Google Sheet; для последующих содержательных итераций обязательно применять proposal, approved decision, preview, apply, verification, append-only timeline и governed reverse change set.
    rationale: Прямое утверждение владельца проекта от 2026-08-01. Решение утверждает только структуру, перенос и governance-механизм и не утверждает модели, цены, поставщиков, новые позиции, технические показатели, окончательные количества или итоговый CAPEX.
    affected_documents:
      - DOC-CAPEX-EQUIPMENT-SPECIFICATION
      - DOC-CAPEX-EQUIPMENT-REGISTER
    approved_by: project owner
    approved_at: 2026-08-01
    supersedes: null
    source_ids:
      - SRC-CAPEX-EQUIPMENT-REGISTER-BRIEF
    updated_at: 2026-08-01
  - id: DEC-008
    title: Добавить CAPEX-05 и модульный конфигуратор форматов точек
    status: approved
    decision: Добавить CAPEX-05-001—CAPEX-05-027 со статусом research; сохранить без смысловых изменений 124 записи CAPEX v0.1; ввести единый Equipment Register, библиотеку функциональных модулей, семь профилей форматов, отдельные конфигурации и configuration overrides; формировать equipment BOM конкретного объекта; обновить только существующую Google Sheet и переименовать её вкладки на русский язык.
    rationale: Прямое утверждение владельца проекта от 2026-08-01. Решение утверждает архитектуру и 27 research-записей, но не утверждает цены, модели, поставщиков, коэффициенты, точные параметры или конфигурацию реального объекта и итоговый CAPEX.
    affected_documents:
      - DOC-CAPEX-EQUIPMENT-REGISTER
      - DOC-CAPEX-MODULES
      - DOC-CAPEX-POINT-FORMATS
      - DOC-CAPEX-CONFIGURATIONS
      - DOC-CAPEX-GENERATED-EQUIPMENT-BOM
    approved_by: project owner
    approved_at: 2026-08-01
    supersedes: null
    source_ids:
      - SRC-CAPEX-MODULAR-CONFIGURATOR-BRIEF
    updated_at: 2026-08-01
  - id: DEC-009
    title: Добавить первичную research-оценку цен пищевого CAPEX
    status: approved
    decision: Добавить к существующему CAPEX Equipment Register первичную research-оценку публичных цен для самостоятельных закупочных позиций MOD-PREP, MOD-RETAIL-HOT, MOD-BAR, MOD-GROW, MOD-POS и MOD-KDS; сформировать MINIMUM, BASE и SCALE_READY и обновить только существующую Google Sheet.
    rationale: Прямое утверждение владельца проекта от 2026-08-02. Цены являются ориентирами публичных карточек, а не утверждёнными моделями, поставщиками, количествами, КП или итоговым CAPEX. CAPEX-05 и все прямо исключённые категории не затрагиваются.
    affected_documents:
      - DOC-CAPEX-EQUIPMENT-REGISTER
      - DOC-CAPEX-PRICE-RESEARCH
    approved_by: project owner
    approved_at: 2026-08-02
    supersedes: null
    source_ids:
      - SRC-CAPEX-PRICE-RESEARCH-BRIEF
    updated_at: 2026-08-02
  - id: DEC-010
    title: Использовать один пароконвектомат и канонический snapshot в рабочем CAPEX-конфигураторе
    status: approved
    decision: Для текущей модели MOD-PREP использовать один профессиональный пароконвектомат CAPEX-01-009 во всех сценариях; пересчитать research-оценку по существующим единичным ценам, обновить существующую Google Sheet и подключить внутренний CAPEX-конфигуратор к детерминированному snapshot канонических реестров.
    rationale: Прямое утверждение владельца проекта от 2026-08-03. Второй аппарат не включается автоматически в SCALE_READY, а страница остаётся скрытым внутренним research-инструментом без показателей финансовой модели.
    affected_documents:
      - DOC-CAPEX-EQUIPMENT-REGISTER
      - DOC-CAPEX-MODULES
      - DOC-CAPEX-PRICE-RESEARCH
    approved_by: project owner
    approved_at: 2026-08-03
    supersedes: null
    source_ids:
      - SRC-CAPEX-WEB-CONFIGURATOR-AUDIT-BRIEF
    updated_at: 2026-08-03
