  - id: DEC-006
    title: Опубликовать три существующих документа проекта в Google Drive
    status: approved
    decision: Создать или обновить в проверенной папке «Колобочная — Investment» нативные Google Docs для Foundation v1.0, Business Model Architecture v1.0 и CAPEX — Equipment Specification v0.1, используя только соответствующие локальные источники и сохраняя их действующие статусы.
    rationale: Прямое задание владельца проекта от 2026-08-01; решение утверждает только техническую публикацию и не переутверждает, не редактирует и не расширяет содержание документов.
    affected_documents:
      - DOC-FOUNDATION
      - DOC-BUSINESS-MODEL-ARCHITECTURE
      - DOC-CAPEX-EQUIPMENT-SPECIFICATION
    approved_by: project owner
    approved_at: 2026-08-01
    supersedes: null
    source_ids:
      - SRC-GOOGLE-DRIVE-PUBLICATION-BRIEF
    updated_at: 2026-08-01
  - id: DEC-007
    title: Создать структурированный CAPEX Equipment Register v0.1 и обязательный lifecycle journal
    status: approved
    decision: Структурно преобразовать все 124 существующие записи CAPEX — Equipment Specification v0.1 в CAPEX Equipment Register v0.1 со статусом research, не меняя смысл исходных позиций; создать производные CSV и нативную Google Sheet; для последующих содержательных итераций обязательно применять proposal, approved decision, preview, apply, verification, append-only timeline и governed reverse change set.
    rationale: Прямое утверждение владельца проекта от 2026-08-01. Решение утверждает только структуру, перенос и governance-механизм и не утверждает модели, цены, поставщиков, новые позиции, технические показатели, окончательные количества или итоговый CAPEX.
    affected_documents:
      - DOC-CAPEX-EQUIPMENT-SPECIFICATION
      - DOC-CAPEX-EQUIPMENT-REGISTER
    approved_by: project owner
    approved_at: 2026-08-01
    supersedes: null
    source_ids:
      - SRC-CAPEX-EQUIPMENT-REGISTER-BRIEF
    updated_at: 2026-08-01
  - id: DEC-008
    title: Добавить CAPEX-05 и модульный конфигуратор форматов точек
    status: approved
    decision: Добавить CAPEX-05-001—CAPEX-05-027 со статусом research; сохранить без смысловых изменений 124 записи CAPEX v0.1; ввести единый Equipment Register, библиотеку функциональных модулей, семь профилей форматов, отдельные конфигурации и configuration overrides; формировать equipment BOM конкретного объекта; обновить только существующую Google Sheet и переименовать её вкладки на русский язык.
    rationale: Прямое утверждение владельца проекта от 2026-08-01. Решение утверждает архитектуру и 27 research-записей, но не утверждает цены, модели, поставщиков, коэффициенты, точные параметры или конфигурацию реального объекта и итоговый CAPEX.
    affected_documents:
      - DOC-CAPEX-EQUIPMENT-REGISTER
      - DOC-CAPEX-MODULES
      - DOC-CAPEX-POINT-FORMATS
      - DOC-CAPEX-CONFIGURATIONS
      - DOC-CAPEX-GENERATED-EQUIPMENT-BOM
    approved_by: project owner
    approved_at: 2026-08-01
    supersedes: null
    source_ids:
      - SRC-CAPEX-MODULAR-CONFIGURATOR-BRIEF
    updated_at: 2026-08-01
  - id: DEC-009
    title: Добавить первичную research-оценку цен пищевого CAPEX
    status: approved
    decision: Добавить к существующему CAPEX Equipment Register первичную research-оценку публичных цен для самостоятельных закупочных позиций MOD-PREP, MOD-RETAIL-HOT, MOD-BAR, MOD-GROW, MOD-POS и MOD-KDS; сформировать MINIMUM, BASE и SCALE_READY и обновить только существующую Google Sheet.
    rationale: Прямое утверждение владельца проекта от 2026-08-02. Цены являются ориентирами публичных карточек, а не утверждёнными моделями, поставщиками, количествами, КП или итоговым CAPEX. CAPEX-05 и все прямо исключённые категории не затрагиваются.
    affected_documents:
      - DOC-CAPEX-EQUIPMENT-REGISTER
      - DOC-CAPEX-PRICE-RESEARCH
    approved_by: project owner
    approved_at: 2026-08-02
    supersedes: null
    source_ids:
      - SRC-CAPEX-PRICE-RESEARCH-BRIEF
    updated_at: 2026-08-02
  - id: DEC-010
    title: Использовать один пароконвектомат и канонический snapshot в рабочем CAPEX-конфигураторе
    status: approved
    decision: Для текущей модели MOD-PREP использовать один профессиональный пароконвектомат CAPEX-01-009 во всех сценариях; пересчитать research-оценку по существующим единичным ценам, обновить существующую Google Sheet и подключить внутренний CAPEX-конфигуратор к детерминированному snapshot канонических реестров.
    rationale: Прямое утверждение владельца проекта от 2026-08-03. Второй аппарат не включается автоматически в SCALE_READY, а страница остаётся скрытым внутренним research-инструментом без показателей финансовой модели.
    affected_documents:
      - DOC-CAPEX-EQUIPMENT-REGISTER
      - DOC-CAPEX-MODULES
      - DOC-CAPEX-PRICE-RESEARCH
    approved_by: project owner
    approved_at: 2026-08-03
    supersedes: null
    source_ids:
      - SRC-CAPEX-WEB-CONFIGURATOR-AUDIT-BRIEF
    updated_at: 2026-08-03
  - id: DEC-011
    title: Сформировать research-базу CAPEX и операционных допущений пилотного объекта
    status: approved
    decision: Зафиксировать пилот как совмещённый заготовочный цех и торговую точку с собственным посадочным залом; добавить одну дедуплицируемую посудомоечную систему и расчётные комплекты мелкого инвентаря; принять как research ПО 120 000 ₽/год, target food cost 25% с упаковкой и стартовые роли; сохранить все зависящие от помещения и запуска расходы открытыми.
    rationale: Прямое задание владельца проекта от 2026-08-03. Исследовательские цены и ставки используются только как ориентиры и не утверждают закупку, помещение, штатное расписание, полный CAPEX или финансовую модель.
    affected_documents:
      - DOC-CAPEX-EQUIPMENT-REGISTER
      - DOC-CAPEX-MODULES
      - DOC-CAPEX-CONFIGURATIONS
      - DOC-CAPEX-GENERATED-EQUIPMENT-BOM
      - DOC-CAPEX-PRICE-RESEARCH
      - DOC-PILOT-CAPEX-ASSUMPTIONS
    approved_by: project owner
    approved_at: 2026-08-03
    supersedes: null
    source_ids:
      - SRC-PILOT-CAPEX-AND-OPERATING-BRIEF
    updated_at: 2026-08-03
  - id: DEC-012
    title: Создать research-калькулятор стартовой потребности в инвестициях
    status: approved
    decision: Зафиксировать Investor Start Model v0.1 и опубликовать скрытую рабочую страницу /launch-budget. Калькулятор сравнивает покупку и аренду, использует каноническую CAPEX-архитектуру, отдельно оценивает мебель по research-ставке, показывает неполные данные как нижнюю границу и не выдаёт неизвестные статьи за ноль.
    rationale: Прямое задание владельца проекта от 2026-08-04. Модель предназначена для предварительного обсуждения порядка финансирования первого совмещённого объекта и не является финансовой моделью или окончательным инвестиционным предложением.
    affected_documents:
      - DOC-INVESTOR-START-MODEL
      - DOC-CAPEX-EQUIPMENT-REGISTER
      - DOC-CAPEX-PRICE-RESEARCH
    approved_by: project owner
    approved_at: 2026-08-04
    supersedes: null
    source_ids:
      - SRC-INVESTOR-START-MODEL-BRIEF
    updated_at: 2026-08-04
  - id: DEC-013
    title: Уточнить публичную подачу расчёта стоимости запуска
    status: approved
    decision: Переименовать скрытую страницу в «Расчёт стоимости запуска», использовать итог «Стоимость запуска», добавить предварительную юридическую подпись, демонстрационный сценарий аренды 350 000 ₽ в месяц с предоплатой 12 месяцев и депозитом 2 месяца, ориентир покупки 69 000 000 ₽, площади 200/90/80 м², убрать технический язык и внутренние документы и показывать фактически включённые части текущей конфигурации.
    rationale: Прямое задание владельца проекта от 2026-08-05. Решение улучшает инвесторскую понятность страницы и сохраняет внутренний аудит, noindex, действующие формулы, ставки, CAPEX-архитектуру и одну единицу пароконвектомата.
    affected_documents:
      - DOC-INVESTOR-START-MODEL
    approved_by: project owner
    approved_at: 2026-08-05
    supersedes: null
    source_ids:
      - SRC-LAUNCH-COST-PRESENTATION-BRIEF
    updated_at: 2026-08-05
  - id: DEC-014
    title: Добавить управляемую структуру подготовки помещения
    status: approved
    decision: Разделить базовую оценку подготовки помещения 11000000 RUB на восемь точно заданных включённых по умолчанию категорий; позволить исключать категории или вводить единую ручную сумму; использовать effectivePreparationAmount в действующих расчётах резерва и стоимости запуска.
    rationale: Прямое задание владельца проекта от 2026-08-05. Решение реализует заранее заданную укрупнённую инвестиционную структуру и не является исследованием, строительной сметой, коммерческим предложением, нормативной стоимостью или финансовой моделью.
    affected_documents:
      - DOC-INVESTOR-START-MODEL
    approved_by: project owner
    approved_at: 2026-08-05
    supersedes: null
    source_ids:
      - SRC-LAUNCH-PREMISES-PREPARATION-BRIEF
    updated_at: 2026-08-05
  - id: DEC-015
    title: Добавить утверждённые research-цены оставшихся позиций CAPEX
    status: approved
    decision: Добавить точные research-ориентиры восьми существующих позиций, сохранить quote_required, включать CAPEX-02-054 и CAPEX-02-055 только при alcohol_enabled == true, исключить повторное суммирование CAPEX-01-012 на launch-budget и заменить видимые подписи плотности посадки.
    rationale: Прямое задание владельца проекта от 2026-08-05. Значения переносятся без интернет-исследования и не утверждают поставщиков, коммерческие предложения, окончательные цены или итоговый CAPEX.
    affected_documents:
      - DOC-CAPEX-EQUIPMENT-REGISTER
      - DOC-CAPEX-PRICE-RESEARCH
      - DOC-CAPEX-MODULES
      - DOC-INVESTOR-START-MODEL
    approved_by: project owner
    approved_at: 2026-08-05
    supersedes: null
    source_ids:
      - SRC-CAPEX-REMAINING-PRICE-IMPLEMENTATION-BRIEF
