  - id: DEC-007
    title: Создать структурированный CAPEX Equipment Register v0.1 и обязательный lifecycle journal
    status: approved
    decision: Структурно преобразовать все 124 существующие записи CAPEX — Equipment Specification v0.1 в CAPEX Equipment Register v0.1 со статусом research, не меняя смысл исходных позиций; создать производные CSV и нативную Google Sheet; для последующих содержательных итераций обязательно применять proposal, approved decision, preview, apply, verification, append-only timeline и governed reverse change set.
    rationale: Прямое утверждение владельца проекта от 2026-08-01. Решение утверждает только структуру, перенос и governance-механизм и не утверждает модели, цены, поставщиков, новые позиции, технические показатели, окончательные количества или итоговый CAPEX.
    affected_documents:
