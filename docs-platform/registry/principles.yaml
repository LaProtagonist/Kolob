  - id: PRP-BMA-007
    title: Развитие собственной инфраструктуры сети
    document: DOC-BUSINESS-MODEL-ARCHITECTURE
    status: approved
    version: "1.0"
    canonical_text: >-
      Собственная инфраструктура сети развивается одновременно с увеличением
      масштаба компании и усложнением её операционной системы. Её назначение
      состоит в повышении качества продукта, управляемости процессов,
      экономической эффективности и скорости дальнейшего развития.


      На базовом этапе в операционную модель интегрируется выращивание зелени,
      микрозелени и отдельных растительных ингредиентов. Этот контур выполняет
      продуктовую, исследовательскую и демонстрационную функции: позволяет
      экспериментировать с ингредиентами, контролировать отдельные параметры
      качества и на практике показывать происхождение части продукта. Масштаб
      выращивания определяется производственными потребностями и фактической
      экономикой.


      По мере роста сети компания может последовательно развивать заготовочное и
      централизованное производство, систему снабжения, логистику, цифровые
      инструменты управления, обучение персонала и контроль стандартов.
      Последовательность развития определяется объёмом сети, загрузкой мощностей
      и экономическим эффектом каждого решения.


      Стратегия недвижимости формируется отдельно для каждой локации и этапа
      развития. Компания сравнивает приобретение помещения в собственность,
      прямую аренду и долгосрочную аренду с правом последующей субаренды,
      выбирая вариант, который обеспечивает оптимальное соотношение капитальных
      затрат, устойчивости, гибкости и долгосрочной стоимости.


      Отдельные элементы инфраструктуры могут со временем формировать
      самостоятельные центры прибыли или активы компании. Решение об их развитии
      принимается на основании измеримого влияния на экономику сети, качество
      продукта, устойчивость снабжения, возможности масштабирования и
      долгосрочную ценность компании.


      Элемент инфраструктуры	Основная роль	Условие дальнейшего развития

      Выращивание зелени и микрозелени	Продуктовые эксперименты, качество,
      демонстрация происхождения ингредиентов	Подтверждённая практическая
      ценность и экономическая эффективность

      Заготовочное производство	Подготовка компонентов и стандартизация
      процессов	Рост объёма собственных и партнёрских точек

      Централизованное производство	Масштабирование выпуска и снижение удельных
      затрат	Достаточная загрузка мощностей

      Логистика и снабжение	Стабильность поставок и управление
      запасами	Территориальный рост и необходимый объём перевозок

      Цифровая система	Управление сетью, данными, качеством и
      прогнозированием	Усложнение операционной структуры

      Недвижимость	Защита локаций, арендный поток и формирование
      активов	Экономическое преимущество перед альтернативными сценариями

      Сельскохозяйственные проекты	Расширение контроля над отдельными
      ингредиентами	Масштаб спроса и подтверждённая экономика
    priority: governing
    source_ids:
      - SRC-BMA-V1-APPROVAL
    decision_id: DEC-004
    updated_at: 2026-08-01
  - id: PRP-BMA-008
    title: Раздельный расчёт экономических контуров
    document: DOC-BUSINESS-MODEL-ARCHITECTURE
    status: approved
    version: "1.0"
    canonical_text: >-
      Экономика каждого функционального контура «Колобочной» рассчитывается
      отдельно независимо от того, находятся ли соответствующие процессы в одном
      помещении или внутри одного юридического лица.


      Розничные продажи, заготовочное и централизованное производство,
      логистика, управление сетью, франчайзинговое направление, недвижимость и
      сельскохозяйственные проекты получают собственные показатели выручки,
      затрат, операционного результата, необходимых активов и потребности в
      оборотном капитале.


      Доходы и расходы, непосредственно связанные с конкретным контуром,
      относятся к нему напрямую. Общие затраты распределяются по заранее
      установленной и документированной методике, отражающей фактическое
      использование персонала, помещений, оборудования и других ресурсов.


      Внутренние поставки, аренда и услуги учитываются при оценке эффективности
      отдельных контуров, но исключаются при консолидации результатов группы.
      Такой подход позволяет определить, где создаётся экономическая ценность,
      какие функции требуют увеличения масштаба, какие направления нуждаются в
      корректировке и какие элементы могут развиваться как самостоятельные
      центры прибыли.


      Финансовая модель должна представлять экономику на трёх уровнях:


      Уровень	Назначение

      Точка или отдельный формат	Оценка жизнеспособности конкретной операционной
      модели

      Функциональный контур	Оценка эффективности производства, логистики,
      управления, недвижимости и других направлений

      Группа компаний	Консолидированный результат после исключения внутренних
      оборотов
    priority: governing
    source_ids:
      - SRC-BMA-V1-APPROVAL
    decision_id: DEC-004
    updated_at: 2026-08-01
  - id: PRP-BMA-009
    title: Границы и статус бизнес-модели
    document: DOC-BUSINESS-MODEL-ARCHITECTURE
    status: approved
    version: "1.0"
    canonical_text: >-
      Бизнес-модель «Колобочной» объединяет подтверждённые результаты проекта,
      решения текущего этапа и направления дальнейшего развития. Для каждого
      положения фиксируется его фактический статус, чтобы накопленный опыт,
      реализуемые решения и целевые возможности не смешивались между собой.


      К подтверждённой основе относятся созданный и реализованный продукт, опыт
      открытия и эксплуатации точек, организация производственных и торговых
      процессов, взаимодействие с покупателями, выраженный общественный интерес
      к концепции и зарегистрированный товарный знак.


      На новом этапе реализуется обновлённая операционная модель, сочетающая
      торговую функцию, заготовочное производство и отдельные элементы
      собственной инфраструктуры. В рамках этого этапа должны быть получены
      фактические показатели экономики, пропускной способности, производственной
      загрузки, требований к помещениям, оборудованию, персоналу и управлению.


      Последовательность масштабирования, степень централизации процессов,
      структура партнёрской сети и развитие отдельных инфраструктурных контуров
      формируются на основании результатов нового этапа. Эти направления
      рассматриваются как рабочие гипотезы и целевые возможности до момента их
      практического и экономического подтверждения.


      Конкретные параметры помещений, объём капитальных вложений, темпы открытия
      точек, финансовые показатели, структура владения активами и условия
      привлечения инвестиций утверждаются отдельными решениями после проведения
      необходимых расчётов и исследований.


      Статус	Содержание

      Подтверждённая основа	Продукт, практический опыт, работа с покупателями,
      общественный интерес, товарный знак

      Реализуется на новом этапе	Обновлённая операционная модель, новая точка,
      заготовочное производство, базовые элементы инфраструктуры

      Рабочая гипотеза	Последовательность масштабирования, распределение
      функций, степень централизации

      Целевая возможность	Партнёрская и франчайзинговая сеть, централизованная
      инфраструктура, недвижимость, логистика и сельскохозяйственные проекты

      Требует отдельного решения	Конкретное помещение, площадь, CAPEX,
      количество точек, сроки, финансовые показатели и условия инвестирования
    priority: governing
    source_ids:
      - SRC-BMA-V1-APPROVAL
    decision_id: DEC-004
    updated_at: 2026-08-01
  - id: PRP-BMA-010
    title: Требования к финансовой модели
    document: DOC-BUSINESS-MODEL-ARCHITECTURE
    status: approved
    version: "1.0"
    canonical_text: >-
      Финансовая модель является количественным отражением утверждённой
      архитектуры бизнеса. Она должна показывать экономику текущего этапа,
      условия перехода к масштабированию и влияние развития каждого нового
      контура на денежные потоки, потребность в капитале и долгосрочную ценность
      компании.


      Все исходные данные разделяются на подтверждённые показатели, расчётные
      допущения и сценарные параметры. Каждое значение должно иметь источник,
      метод расчёта или явно зафиксированный статус допущения. Изменение
      ключевых параметров должно автоматически отражаться во всех связанных
      расчётах.


      Экономика торговой точки рассчитывается отдельно для периода запуска,
      выхода на устойчивый режим и зрелой работы. Модель должна учитывать
      выручку, средний чек, количество продаж, структуру ассортимента,
      себестоимость продукции, списания, затраты на персонал, эксплуатационные
      расходы, налоги, оборотный капитал и капитальные вложения.


      Для помещения сравниваются три сценария:


      — приобретение в собственность;

      — прямая аренда;

      — долгосрочная аренда с правом последующей субаренды.


      Для каждого сценария рассчитываются первоначальные вложения, влияние на
      денежный поток, стоимость финансирования, срок окупаемости, остаточная
      стоимость, риски и доходность вложенного капитала.


      Заготовочное и централизованное производство, логистика, управление сетью,
      партнёрские и франчайзинговые форматы, недвижимость, цифровые системы и
      сельскохозяйственные проекты моделируются как отдельные экономические
      контуры. Для каждого контура определяются условия запуска, необходимый
      масштаб, загрузка мощностей, постоянные и переменные затраты, потребность
      в активах и влияние на экономику всей сети.


      Модель развития сети строится по этапам и показывает количество
      собственных и партнёрских точек, сроки их открытия, капитальные затраты,
      потребность в оборотном капитале, развитие инфраструктуры и источники
      финансирования. Переход к следующему этапу связывается с достижением
      установленных операционных и финансовых критериев.


      Финансовая модель должна включать взаимосвязанные отчёты о прибылях и
      убытках, движении денежных средств и финансовом положении, а также
      консолидированный результат группы после исключения внутригрупповых
      оборотов.


      Для ключевых параметров проводится сценарный анализ и анализ
      чувствительности. В итоговых результатах отражаются потребность в
      инвестициях, структура использования капитала, точка безубыточности,
      денежный резерв, сроки выхода на устойчивый денежный поток, окупаемость
      вложений и факторы, наиболее существенно влияющие на результат.


      Блок модели	Основная задача

      Экономика торговой точки	Определить жизнеспособность и зрелую доходность
      формата

      Сценарии недвижимости	Сравнить покупку, аренду и аренду с последующей
      субарендой

      Производство и снабжение	Определить загрузку, себестоимость и условия
      централизации

      Развитие сети	Рассчитать последовательность открытий и потребность в
      капитале

      Партнёрская модель	Проверить экономику управляющей компании и партнёра

      Инфраструктура	Оценить условия запуска и эффект новых экономических
      контуров

      Консолидация	Получить фактический результат группы без внутренних оборотов

      Сценарный анализ	Определить диапазон результатов и основные факторы риска
    priority: governing
    source_ids:
      - SRC-BMA-V1-APPROVAL
    decision_id: DEC-004
    updated_at: 2026-08-01
