schema_version: 1
principles:
  - id: PRP-FND-001
    title: Назначение проекта
    document: DOC-FOUNDATION
    status: approved
    version: "1.0"
    canonical_text: >-
      Проект «Колобочная» является основой для создания и развития компании,
      способной масштабировать новый формат общественного питания федерального
      уровня.

      Все стратегические решения внутри проекта принимаются с позиции их влияния
      на долгосрочное развитие компании, её устойчивость, потенциал
      масштабирования и способность создавать самостоятельную ценность на каждом
      этапе своего развития.
    priority: governing
    source_ids:
      - SRC-FOUNDATION-V1-APPROVAL
    decision_id: DEC-003
    updated_at: 2026-07-23
  - id: PRP-FND-002
    title: Главный актив проекта
    document: DOC-FOUNDATION
    status: approved
    version: "1.0"
    canonical_text: >-
      Главным активом проекта является не отдельный продукт, технология или
      объект инфраструктуры, а компания, её способность к развитию,
      масштабированию и долгосрочному созданию ценности.

      Любые материальные и нематериальные активы рассматриваются как инструменты
      усиления компании, а не как самостоятельная цель её существования.
    priority: governing
    source_ids:
      - SRC-FOUNDATION-V1-APPROVAL
    decision_id: DEC-003
    updated_at: 2026-07-23
  - id: PRP-FND-003
    title: Главная цель проекта
    document: DOC-FOUNDATION
    status: approved
    version: "1.0"
    canonical_text: >-
      Главной целью проекта является последовательное увеличение долгосрочной
      ценности компании.

      Рост выручки, прибыли, количества объектов, производственных мощностей,
      инфраструктуры и иных показателей рассматривается как средство достижения
      этой цели, а не как самостоятельная цель развития.
    priority: governing
    source_ids:
      - SRC-FOUNDATION-V1-APPROVAL
    decision_id: DEC-003
    updated_at: 2026-07-23
  - id: PRP-FND-004
    title: Принцип развития
    document: DOC-FOUNDATION
    status: approved
    version: "1.0"
    canonical_text: >-
      Развитие компании осуществляется через последовательное усиление её
      конкурентных преимуществ, устойчивости и способности к масштабированию.

      Каждый новый этап развития должен не только решать текущие задачи, но и
      создавать основу для реализации последующих этапов, увеличивая общую
      ценность компании.
    priority: governing
    source_ids:
      - SRC-FOUNDATION-V1-APPROVAL
    decision_id: DEC-003
    updated_at: 2026-07-23
  - id: PRP-FND-005
    title: Развитие инфраструктуры
    document: DOC-FOUNDATION
    status: approved
    version: "1.0"
    canonical_text: >-
      Развитие собственной инфраструктуры рассматривается как естественный этап
      эволюции компании по мере её роста и масштабирования.

      Создание производственных мощностей, логистической системы, собственных
      объектов, сельскохозяйственных проектов и других элементов инфраструктуры
      осуществляется только тогда, когда это повышает эффективность,
      устойчивость и долгосрочную ценность компании.
    priority: governing
    source_ids:
      - SRC-FOUNDATION-V1-APPROVAL
    decision_id: DEC-003
    updated_at: 2026-07-23
  - id: PRP-FND-006
    title: Принцип принятия решений
    document: DOC-FOUNDATION
    status: approved
    version: "1.0"
    canonical_text: >-
      Все стратегические решения принимаются на основе объективных данных,
      практического опыта, проверки гипотез и их влияния на долгосрочную
      ценность компании.

      Ни одно решение не считается верным только потому, что оно соответствует
      первоначальному замыслу. Любая гипотеза может быть пересмотрена, если
      накопленные данные подтверждают необходимость такого изменения.
    priority: governing
    source_ids:
      - SRC-FOUNDATION-V1-APPROVAL
    decision_id: DEC-003
    updated_at: 2026-07-23
  - id: PRP-FND-007
    title: Приоритет Foundation
    document: DOC-FOUNDATION
    status: approved
    version: "1.0"
    canonical_text: >-
      Foundation определяет базовые принципы проекта и является исходной точкой
      для разработки всех остальных документов.

      При возникновении противоречий между Foundation и производными документами
      в первую очередь проводится анализ причин расхождения. Изменение
      Foundation допускается только при осознанном пересмотре базовых принципов
      проекта. Во всех остальных случаях в соответствие с Foundation приводятся
      производные документы.
    priority: governing
    source_ids:
      - SRC-FOUNDATION-V1-APPROVAL
    decision_id: DEC-003
    updated_at: 2026-07-23
  - id: PRP-BMA-001
    title: Ядро бизнес-модели
    document: DOC-BUSINESS-MODEL-ARCHITECTURE
    status: approved
    version: "1.0"
    canonical_text: >-
      Ядром бизнес-модели «Колобочной» является воспроизводимая система,
      объединяющая продукт, бренд, операционную модель, стандарты качества и
      механизмы управления сетью.


      Базовой операционной единицей этой системы является точка сети
      «Колобочная». Её конфигурация может изменяться в зависимости от локации и
      назначения: точка может совмещать торговую и производственную функции,
      включать посадочный зал, работать преимущественно навынос либо быть
      адаптирована для размещения на транспортных маршрутах, фудкортах и в
      других форматах. При этом основные требования к продукту, качеству,
      технологии и управлению должны оставаться воспроизводимыми.


      На первом этапе основной денежный поток формируется собственными точками
      сети за счёт розничных продаж конечному покупателю. По мере роста сети
      бизнес-модель может дополняться централизованным производством,
      логистикой, партнёрскими и франчайзинговыми форматами, цифровыми
      системами, недвижимостью и другими элементами собственной инфраструктуры.


      Каждый новый элемент должен усиливать экономику основной деятельности,
      качество продукта, управляемость сети или долгосрочную ценность компании.
      Развитие инфраструктуры не заменяет основную бизнес-модель, а расширяет её
      возможности по мере достижения необходимого масштаба.


      ```text

      Продукт и бренд
              ↓
      Воспроизводимая модель точки сети
              ↓
      Сеть собственных и партнёрских точек
              ↓
      Развитие собственной инфраструктуры сети
              ↓
      Рост устойчивости и долгосрочной ценности компании

      ```
    priority: governing
    source_ids:
      - SRC-BMA-V1-APPROVAL
    decision_id: DEC-004
    updated_at: 2026-08-01
  - id: PRP-BMA-002
    title: Практическая основа и задача нового этапа
    document: DOC-BUSINESS-MODEL-ARCHITECTURE
    status: approved
    version: "1.0"
    canonical_text: >-
      Проект «Колобочная» опирается на накопленный практический опыт создания и
      реализации продукта. Продукт неоднократно выводился в продажу; команда
      получила опыт открытия и эксплуатации точек, организации производственных
      и торговых процессов, а также прямого взаимодействия с покупателями.


      Концепция вызвала выраженный интерес аудитории. Проект получил
      значительное количество положительных отзывов, а отдельные публикации и
      обзоры набирали миллионы просмотров. Такой отклик свидетельствует о
      высоком коммуникационном потенциале концепции и её способности привлекать
      внимание за пределами конкретной точки продаж.


      Товарный знак «Колобочная» зарегистрирован и получил правовую охрану.


      Новый этап проекта предусматривает практическую реализацию обновлённой
      операционной модели, рассчитанной на последующее тиражирование. В её
      основе — сочетание торговой функции и заготовочного производства с
      возможностью дальнейшего распределения и централизации отдельных процессов
      по мере роста сети.


      Результатом этапа должна стать воспроизводимая операционная модель с
      проверенными экономическими показателями, определёнными требованиями к
      помещениям и оборудованию, рассчитанной пропускной способностью,
      сформированными стандартами управления и критериями перехода к
      масштабированию.
    priority: governing
    source_ids:
      - SRC-BMA-V1-APPROVAL
    decision_id: DEC-004
    updated_at: 2026-08-01
  - id: PRP-BMA-003
    title: Архитектура точки сети
    document: DOC-BUSINESS-MODEL-ARCHITECTURE
    status: approved
    version: "1.0"
    canonical_text: >-
      Точка сети «Колобочная» объединяет несколько функциональных контуров:
      приём и хранение сырья, заготовочное производство, финальное
      приготовление, продажу и обслуживание покупателей. Конкретный состав и
      размещение этих функций определяются форматом точки, её площадью, локацией
      и ролью в общей системе сети.


      Базовый формат нового этапа предусматривает сочетание торговой части и
      заготовочного производства в одном помещении. Такая конфигурация позволяет
      одновременно отработать розничную модель, производственные процессы,
      загрузку оборудования, движение сырья и готовой продукции, требования к
      персоналу и систему управления.


      По мере развития сети отдельные функции могут распределяться между разными
      форматами. Часть точек может сохранять расширенный производственный цикл,
      часть — работать с централизованно подготовленными компонентами, а
      отдельные площадки — специализироваться на производстве и снабжении сети.


      Такой подход позволяет адаптировать точки для разных условий: работы с
      посадочным залом, продаж навынос, размещения на фудкортах, транспортных
      маршрутах и в других коммерческих локациях. При различии форматов едиными
      остаются требования к продукту, качеству, технологии и управлению.
    priority: governing
    source_ids:
      - SRC-BMA-V1-APPROVAL
    decision_id: DEC-004
    updated_at: 2026-08-01
  - id: PRP-BMA-004
    title: Цепочка создания продукта и ценности для гостя
    document: DOC-BUSINESS-MODEL-ARCHITECTURE
    status: approved
    version: "1.0"
    canonical_text: >-
      Цепочка создания ценности «Колобочной» начинается с управления продуктом и
      ассортиментом. Для каждой позиции определяются рецептура, состав,
      требования к сырью, технологический процесс, условия хранения, стандарты
      приготовления и подачи. Единая продуктовая система обеспечивает
      воспроизводимость результата в разных точках сети.


      Следующий контур объединяет закупку сырья, выращивание отдельных
      ингредиентов, заготовочное производство, хранение и логистику. На новом
      этапе часть этих процессов сосредоточена в одном помещении с торговой
      точкой. По мере развития сети повторяемые операции могут последовательно
      централизоваться, повышая управляемость качества, эффективность
      использования оборудования и производительность системы.


      В торговой точке сети подготовленные компоненты проходят финальное
      приготовление и превращаются в готовый продукт для покупателя. Продажи,
      скорость обслуживания, структура спроса, списания, отзывы и другие
      операционные показатели формируют данные для дальнейшего управления
      компанией.


      Полученная информация используется для совершенствования ассортимента,
      рецептур, закупок, производственной загрузки, стандартов работы и форматов
      точек. Таким образом, цепочка создания ценности представляет собой
      замкнутую систему, в которой практические результаты каждого этапа
      используются для развития продукта и всей сети.


      Управление продуктом и ассортиментом
              ↓
      Сырьё и выращивание отдельных ингредиентов
              ↓
      Заготовка и производство
              ↓
      Хранение и логистика
              ↓
      Финальное приготовление и продажа
              ↓
      Данные и обратная связь
              ↓
      Совершенствование продукта и процессов
    priority: governing
    source_ids:
      - SRC-BMA-V1-APPROVAL
    decision_id: DEC-004
    updated_at: 2026-08-01
  - id: PRP-BMA-005
    title: Контуры бизнеса и денежных потоков
    document: DOC-BUSINESS-MODEL-ARCHITECTURE
    status: approved
    version: "1.0"
    canonical_text: >-
      Экономическая архитектура «Колобочной» формируется из нескольких
      взаимосвязанных контуров. На новом этапе базовым является розничный
      контур: собственные торговые точки получают выручку от продажи продукции
      конечному покупателю. Его экономика определяется объёмом продаж, средним
      чеком, себестоимостью продукции, производительностью труда, списаниями и
      операционными расходами точки.


      По мере роста сети может выделяться производственно-снабженческий контур.
      Заготовочное и централизованное производство обеспечивает собственные и
      партнёрские точки подготовленными компонентами, продукцией и материалами.
      Экономический результат этого контура формируется за счёт загрузки
      производственных мощностей, снижения удельной себестоимости,
      стандартизации качества и маржи поставок.


      При развитии партнёрских и франчайзинговых форматов возникает отдельный
      контур управления сетью. Его денежные потоки могут включать первоначальные
      платежи, роялти, оплату сервисов, обучения, цифровых систем и поставок.
      Устойчивость этого контура определяется одновременно экономикой
      управляющей компании и экономической жизнеспособностью партнёрской точки.


      Недвижимость, логистика, цифровые системы и сельскохозяйственные проекты
      могут формировать самостоятельные экономические контуры по мере достижения
      необходимого масштаба. Они способны создавать прямой доход, снижать
      затраты, повышать качество и управляемость либо формировать долгосрочные
      активы компании.


      Каждый экономический контур рассчитывается отдельно, чтобы оценивать его
      эффективность и жизнеспособность. При формировании консолидированной
      финансовой модели внутригрупповые продажи, аренда и другие внутренние
      платежи исключаются: выручкой группы признаются только поступления от
      внешних клиентов, а внутренняя маржа — только после реализации продукции
      за пределами группы.


      Контур	Стадия развития	Основной экономический результат

      Собственные торговые точки	Базовый контур	Розничная выручка и операционная
      прибыль

      Производство и снабжение	По мере роста сети	Производственная эффективность
      и маржа поставок

      Управление партнёрской сетью	После подтверждения модели	Роялти, сервисные
      и первоначальные платежи

      Недвижимость	При экономическом обосновании	Арендный доход, защита локаций
      и стоимость активов

      Логистика	При достаточном объёме сети	Снижение затрат, управляемость
      поставок или отдельная маржа

      Цифровые системы	По мере усложнения сети	Повышение эффективности, контроля
      и качества решений

      Сельскохозяйственные и R&D-проекты	Базовые эксперименты и дальнейшее
      развитие	Ингредиенты, исследования, качество и усиление продукта
    priority: governing
    source_ids:
      - SRC-BMA-V1-APPROVAL
    decision_id: DEC-004
    updated_at: 2026-08-01
  - id: PRP-BMA-006
    title: Механика масштабирования
    document: DOC-BUSINESS-MODEL-ARCHITECTURE
    status: approved
    version: "1.0"
    canonical_text: >-
      Масштабирование «Колобочной» строится как последовательное воспроизведение
      подтверждённой операционной модели. Каждый этап развития должен
      обеспечивать управляемый рост сети при сохранении качества продукта,
      экономической эффективности и единых стандартов работы.


      Первым этапом становится запуск точки нового формата и формирование её
      устойчивой операционной модели. На этом этапе определяются фактическая
      экономика, производственная загрузка, пропускная способность, требования к
      персоналу, оборудованию, помещению и системе управления.


      Следующий этап предусматривает развитие группы собственных точек. Их
      совместная работа позволяет подтвердить воспроизводимость модели в разных
      локациях, сформировать управленческую структуру и определить процессы,
      которые целесообразно централизовать.


      По мере увеличения количества точек повторяемые производственные,
      снабженческие, логистические и управленческие функции могут объединяться в
      общую инфраструктуру сети. Централизация осуществляется поэтапно и должна
      обеспечивать измеримый экономический или операционный эффект.


      Партнёрские и франчайзинговые форматы становятся следующим каналом
      развития после формирования устойчивых стандартов, подтверждения экономики
      точки и готовности системы к передаче технологии внешнему оператору.
      Экономика партнёрской точки должна сохранять привлекательность после всех
      платежей в пользу управляющей компании.


      Региональное и федеральное развитие строится через последовательное
      создание территориальных групп точек, обеспеченных необходимыми
      производственными, логистическими и управленческими ресурсами. Такая
      модель позволяет соотносить скорость открытия новых точек с реальной
      готовностью инфраструктуры сети.


      Точка нового формата
              ↓
      Устойчивая операционная модель
              ↓
      Группа собственных точек
              ↓
      Централизация повторяемых процессов
              ↓
      Партнёрские и франчайзинговые форматы
              ↓
      Региональные группы точек
              ↓
      Федеральная сеть


      Переход к каждому следующему этапу определяется совокупностью критериев:


      Критерий	Что оценивается

      Экономика	Выручка, маржинальность, денежный поток и возврат вложенного
      капитала

      Воспроизводимость	Стабильность показателей в разных точках и локациях

      Качество	Соответствие продукта и обслуживания единым стандартам

      Управляемость	Возможность контролировать сеть без потери эффективности

      Производственная готовность	Достаточность мощностей и устойчивость
      снабжения

      Логистическая готовность	Возможность своевременно обеспечивать точки

      Партнёрская экономика	Доходность и устойчивость модели для внешнего
      оператора

      Капитал	Соответствие темпов развития доступным источникам финансирования
    priority: governing
    source_ids:
      - SRC-BMA-V1-APPROVAL
    decision_id: DEC-004
