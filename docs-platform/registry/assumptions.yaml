    value:
      prep_cook: 1
      line_cook: 2
      barista_cashier: 2
      cleaner: 1
      administrator: 1
    unit: posts per operating shift
    status: research
    rationale: Прямой ориентир владельца проекта; headcount и графики требуют операционного режима и часов работы.
    scenario: PILOT_BASE
    applies_to:
