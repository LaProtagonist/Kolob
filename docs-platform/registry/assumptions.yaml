  - id: ASM-PILOT-PAYROLL-SPB
    title: Исследовательский фонд работодателя для стартовых постов
    value:
      from_rub_per_month: 1290051.62
      to_rub_per_month: 1368735.63
    unit: RUB/month
    status: research
    rationale: Расчёт по видимым вакансиям Санкт-Петербурга, 30 операционным дням, графику 2/2, НДФЛ 13% и диапазону страховых взносов. Не включает ряд кадровых расходов.
    scenario: PILOT_BASE
    applies_to:
      - DOC-PILOT-CAPEX-ASSUMPTIONS
    source_ids:
      - SRC-LABOR-SPB-20260803-PREP
      - SRC-LABOR-SPB-20260803-BARISTA
      - SRC-LABOR-SPB-20260803-ADMIN
      - SRC-TAX-2026-CONTRIBUTIONS
    decision_id: DEC-011
    updated_at: 2026-08-03
