  - id: ASM-PILOT-FOOD-COST
    title: Целевая рецептурная себестоимость с упаковкой
    value: 25
    unit: percent of revenue
    status: research
    rationale: Цена равна четырём рецептурным себестоимостям; это формальная наценка 300% и валовая маржа 75% до прочих затрат.
