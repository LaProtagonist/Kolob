scenario_assumptions:
  central_production_capacity:
    value: "до 10 торговых точек"
    status: assumption
    source_id: SRC-FRANCHISE-PLATFORM-2026-09-07-BRIEF
    validation_required: [technical_cards, process_cycles, shift_plan, storage_capacity, logistics_plan]
  trading_function:
    option_a: "Торговая функция внутри производственного помещения"
    option_b: "1–2 внешние эталонные точки в креативном кластере, фудкорте или торговом центре"
    status: proposed
    capex_treatment: "CAPEX внешних точек не входит в этот производственный сценарий. Используется существующая модель точки после привязки к подтверждённому формату."
  second_combi_oven:
    status: excluded
    rationale: "На старте учитывается существующий большой Rational; второй пароконвектомат не заложен."
capex:
  currency: RUB
  status: research
  central_production_equipment_delta:
    range_rub: [900000, 1000000]
    status: assumption
  existing_equipment_diagnostics_service_and_commissioning:
    range_rub: [150000, 300000]
    status: assumption
  central_production_equipment_delta_total:
    range_rub: [1100000, 1300000]
    status: assumption
  ee_office_hardware:
    range_rub: [550000, 700000]
    status: assumption
    note: "Рабочий диапазон для scenario CAPEX; конкретная модель оборудования не утверждена."
  first_media_program:
    range_rub: [1200000, 1600000]
    status: assumption
  infrastructure_base_without_trading_point:
    range_rub: [3000000, 3600000]
    status: assumption
    includes: [central_production_equipment_delta_total, ee_office_hardware, first_media_program]
    excludes: [rent, deposit, payroll, inventory, trading_hall, individual_trading_points]
missing_inputs_reference: docs-platform/checklists/franchise-platform-missing-inputs.md
